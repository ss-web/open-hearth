services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth_dev_only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d open_hearth"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
